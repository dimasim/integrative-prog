# ============================================================
# Docker Compose — hanya untuk aplikasi Go
# PostgreSQL tetap berjalan di VM VirtualBox (external)
# ============================================================
version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: go-restapi
    restart: unless-stopped
    ports:
      - "8088:8088"
    env_file:
      - .env
    # host.docker.internal → otomatis resolve ke IP host mesin
    # Diperlukan agar container bisa reach PostgreSQL di VM VirtualBox
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8088/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
