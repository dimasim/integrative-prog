# ============================================================
# Docker Compose — Go App & PostgreSQL
# ============================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: go-restapi
    restart: unless-stopped
    ports:
      - "${APP_PORT}:${APP_PORT}"
    env_file:
      - .env
    environment:
      - DB_HOST=db
    networks:
      - app-network
    
    # Best Practice: Pastikan Go menunggu PostgreSQL benar-benar siap menerima koneksi
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${APP_PORT}/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  db:
    image: postgres:15-alpine
    container_name: postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      # Best Practice Keamanan: Hanya diekspos ke localhost mesin host (VPS/Lokal)
      # Mencegah akses publik langsung ke port 5432 dari luar
      - "127.0.0.1:${DB_PORT}:5432"
    volumes:
      # Best Practice Maintainability: Gunakan named volume agar data persisten
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network
    # Best Practice: Healthcheck bawaan Postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${DB_USER} -d $${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

# Best Practice Keamanan & Efisiensi: Isolasi komunikasi antar container di network khusus
networks:
  app-network:
    driver: bridge

# Deklarasi volume untuk persistensi data
volumes:
  pgdata: 